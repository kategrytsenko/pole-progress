    <main class="p-4">
      @if (auth.loading()) {
        <p aria-live="polite">Loading…</p>
      } @else {
        @if (auth.isAuthed()) {
          <p>
            Hi, <strong>{{ auth.user()?.email }}</strong>
            <span class="ml-2">role: <strong>{{ auth.role() ?? '—' }}</strong></span>
          </p>

          <button
            type="button"
            class="underline"
            (click)="onSignOut()"
          >
            Sign out
          </button>
        } @else {
          <label class="block">
            <span class="block text-sm font-medium">Email</span>
            <input
              class="mt-1 w-full rounded border p-2"
              type="email"
              autocomplete="email"
              [value]="email()"
              (input)="email.set(($any($event.target)).value)"
            />
          </label>

          <button type="button" class="mt-3 rounded border px-3 py-2" (click)="onSendLink()">
            Send magic link
          </button>

          @if (auth.error()) {
            <p class="mt-2 text-sm" role="alert">{{ auth.error() }}</p>
          }
        }
      }

      <router-outlet />
    </main>
